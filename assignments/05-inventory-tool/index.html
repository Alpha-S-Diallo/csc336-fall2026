
<html>
    <head>
        <title>E-commerce</title>
        <script src="./script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="Store">
            <h1>Welcome!</h1>
        </div>

        <div id="formDiv">
            <form id="productForm">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Product name" required>

                <label for="price">Price</label>
                <input id="price" name="price" type="number" min="0" step="0.01" placeholder="9.99" required>

                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="description" required></textarea>

                <label for="image">Image</label>
                <input id="image" name="image" type="url" placeholder="https://csc-336/image.png" required>

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="sports">sports</option>
                    <option value="utilities">utilities</option>
                </select>

                <button type="submit">Add Product</button>
            </form>
        </div>

        <div id="filterDiv"></div>

        <div id="mainDiv">
            <div id="productDiv"></div>
            <div id="cartDiv"></div>
        </div>
    </body>
</html>
